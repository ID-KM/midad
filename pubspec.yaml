name: midad
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image: ^4.8.0
  lucide_flutter: ^1.25.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.4.7
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  xml: ^6.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pdf: ^3.12.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D1B2A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
